# dinuk test configuration used by HSQLDBTest.
# Each partitioned view maps to its physical tables as described in the README.

# key mode: orders_<id>
viewNamePrefix=orders
partitionType=key
partitionKey=id

# key mode: users_<id>
viewNamePrefix2=users
partitionType2=key
partitionKey2=id

# range mode: orders_range_0 (0-10), orders_range_1 (11-20)
viewNamePrefix3=orders_range
partitionType3=range
partitionKey3=id
orders_range.range.1.low=0
orders_range.range.1.high=10
orders_range.range.1.table=orders_range_0
orders_range.range.2.low=11
orders_range.range.2.high=20
orders_range.range.2.table=orders_range_1

# list mode: orders_list_na (us,ca,mx), orders_list_eu (uk,ie)
viewNamePrefix4=orders_list
partitionType4=list
partitionKey4=region
orders_list.list.1.values=us,ca,mx
orders_list.list.1.table=orders_list_na
orders_list.list.2.values=uk,ie
orders_list.list.2.table=orders_list_eu

# hash mode: orders_hash_MOD(id, 4)
viewNamePrefix5=orders_hash
partitionType5=hash
partitionKey5=id
orders_hash.hash.partitions=4
